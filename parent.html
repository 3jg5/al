<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>تأكيد الحضور | ملتقى أولياء الأمور</title>
<style>
:root{--g:#b8893a;--d:#14301f;--bg:#f6f3ec;--c:#fff;--t:#1d1d1d;--e:#b3261e;--ok:#1b6e3c}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--d);color:#fff;text-align:center;padding:22px 16px}h1{margin:0;font-size:1.25rem}header p{margin:6px 0 0;opacity:.85;font-size:.9rem}
main{max-width:560px;margin:0 auto;padding:16px}.card{background:var(--c);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px #0001}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:12px;border:2px solid var(--d);background:#fff;border-radius:10px;font:inherit;cursor:pointer}.tabs [aria-selected=true]{background:var(--d);color:#fff}
label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;font:inherit;font-size:1rem;border:1.5px solid #bbb;border-radius:10px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--g);outline-offset:1px}.row{display:flex;gap:8px}.row>*{flex:1}
ul{list-style:none;margin:8px 0 0;padding:0}li button{width:100%;text-align:right;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:10px;background:#fafafa;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
li button:hover{border-color:var(--g)}.b{background:var(--g);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem;white-space:nowrap}
.pick{display:flex;gap:10px}.pick label{flex:1;margin:0;border:2px solid #ccc;border-radius:10px;padding:12px;text-align:center;font-weight:400;cursor:pointer}.pick input{width:auto;margin-left:6px}.pick label:has(input:checked){border-color:var(--ok);background:#e9f6ee;font-weight:700}
.btn{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:var(--d);color:#fff;font:inherit;font-size:1.05rem;cursor:pointer}.btn.alt{background:#fff;color:var(--d);border:2px solid var(--d)}.btn:disabled{opacity:.5}
.err{color:var(--e);font-size:.9rem;min-height:1.2em;margin-top:6px}.ok{background:#e9f6ee;border:1px solid var(--ok);color:var(--ok);padding:16px;border-radius:12px;font-weight:700}
.hp{position:absolute;left:-9999px}dialog{border:0;border-radius:14px;max-width:420px;width:92%;padding:20px}dialog::backdrop{background:#0007}.sm{color:#666;font-size:.85rem}[hidden]{display:none!important}
</style></head><body>
<header><h1>ملتقى أولياء الأمور</h1><p>تأكيد الحضور — مدرسة الفاروق للتعليم الأساسي للبنين</p></header>
<main>
<section class="card" id="find">
  <div class="tabs" role="tablist"><button role="tab" id="t1" aria-selected="true">البحث بالاسم</button><button role="tab" id="t2" aria-selected="false">حسب الصف والشعبة</button></div>
  <div id="p1"><label for="q">اكتبوا اسم الطالب (ولو جزءًا منه)</label>
    <input id="q" type="search" autocomplete="off" inputmode="search" placeholder="مثال: أحمد السعيدي" aria-controls="res1"><ul id="res1" aria-live="polite"></ul></div>
  <div id="p2" hidden><div class="row"><div><label for="g">الصف</label><select id="g"><option value="">اختر</option><option>10</option><option>11</option><option>12</option></select></div>
    <div><label for="s">الشعبة</label><select id="s" disabled><option value="">اختر</option></select></div></div><ul id="res2" aria-live="polite"></ul></div>
  <div class="err" id="e1" role="alert"></div>
</section>
<form class="card" id="form" hidden novalidate autocomplete="off">
  <div class="sm">الطالب المختار</div><div id="chosen" style="font-weight:700;margin:4px 0"></div>
  <button type="button" class="btn alt" id="change" style="margin:6px 0 0;padding:8px">تغيير الطالب</button>
  <label for="pn">اسم ولي الأمر <span class="sm">(مقترح من اسم الأب، عدّلوه عند الحاجة)</span></label><input id="pn" maxlength="80" required autocomplete="name">
  <label for="ph">رقم الهاتف (عُماني)</label><input id="ph" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" placeholder="9xxxxxxx" required autocomplete="tel-national">
  <label id="al">هل ستحضرون؟</label>
  <div class="pick" role="radiogroup" aria-labelledby="al"><label><input type="radio" name="a" value="1">سأحضر</label><label><input type="radio" name="a" value="0">أعتذر</label></div>
  <input class="hp" name="website" id="hp" tabindex="-1" aria-hidden="true">
  <div class="err" id="e2" role="alert"></div><button class="btn" id="go">مراجعة وإرسال</button>
</form>
<div class="ok" id="done" role="status" hidden></div>
</main>
<dialog id="dlg"><h2 style="margin-top:0">تأكيد البيانات</h2><div id="sum" style="line-height:1.9"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="yes" style="margin:0">تأكيد</button><button class="btn alt" id="no" style="margin:0">رجوع</button></div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FB_CONFIG);
const F=firebase.app().functions(FB_REGION),call=n=>F.httpsCallable(n),$=i=>document.getElementById(i);
const SEC={10:7,11:11,12:12};let sel=null,seq=0,timer;
const msg=e=>e&&e.message&&!/internal|INTERNAL/.test(e.message)?e.message:'تعذّر الاتصال، تأكدوا من الإنترنت وحاولوا مرة أخرى.';
// تبويبات
[['t1','p1','t2','p2'],['t2','p2','t1','p1']].forEach(([a,pa,b,pb])=>$(a).onclick=()=>{$(a).setAttribute('aria-selected',true);$(b).setAttribute('aria-selected',false);$(pa).hidden=false;$(pb).hidden=true;$('e1').textContent=''});
function render(ul,list){ul.innerHTML='';if(!list.length){ul.innerHTML='<li class="sm" style="margin-top:8px">لا توجد نتائج مطابقة.</li>';return}
 list.forEach(x=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';
  b.innerHTML='<span></span><span class="b">الصف '+x.g+' / شعبة '+x.s+'</span>';b.firstChild.textContent=x.n;b.onclick=()=>pick(x);li.appendChild(b);ul.appendChild(li)})}
// البحث الفوري (debounce + تجاهل الردود القديمة)
$('q').oninput=e=>{clearTimeout(timer);const v=e.target.value.trim();$('e1').textContent='';
 if(v.length<2){$('res1').innerHTML='';return}
 timer=setTimeout(async()=>{const my=++seq;try{const r=await call('searchStudents')({q:v});if(my===seq)render($('res1'),r.data)}catch(x){$('e1').textContent=msg(x)}},300)};
$('g').onchange=()=>{const n=SEC[$('g').value]||0,s=$('s');s.innerHTML='<option value="">اختر</option>';for(let i=1;i<=n;i++)s.add(new Option('شعبة '+i,i));s.disabled=!n;$('res2').innerHTML=''};
$('s').onchange=async()=>{if(!$('s').value)return;$('e1').textContent='';try{const r=await call('listSection')({g:+$('g').value,s:+$('s').value});render($('res2'),r.data)}catch(x){$('e1').textContent=msg(x)}};
// اقتراح اسم ولي الأمر: (اسم الأب + اللقب) من صيغة "فلان بن فلان ... اللقب"
function guess(n){const t=n.split(' ');return t.length>=3&&t[1]==='بن'?t[2]+' '+t[t.length-1]:''}
function pick(x){sel=x;$('chosen').textContent=x.n+' — الصف '+x.g+' / شعبة '+x.s;$('pn').value=guess(x.n);$('find').hidden=true;$('form').hidden=false;$('ph').focus()}
$('change').onclick=()=>{$('form').hidden=true;$('find').hidden=false;$('q').focus()};
const phone=()=>$('ph').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'').replace(/^(00)?968/,'');
$('form').onsubmit=e=>{e.preventDefault();const pn=$('pn').value.trim(),a=document.querySelector('[name=a]:checked'),er=$('e2');
 if(pn.length<3)return er.textContent='اكتبوا اسم ولي الأمر.',$('pn').focus();
 if(!/^[79]\d{7}$/.test(phone()))return er.textContent='رقم الهاتف يجب أن يكون 8 أرقام تبدأ بـ 7 أو 9.',$('ph').focus();
 if(!a)return er.textContent='اختاروا: سأحضر أو أعتذر.';er.textContent='';
 $('sum').innerHTML='';[['الطالب',sel.n],['ولي الأمر',pn],['الهاتف','+968 '+phone()],['القرار',a.value==='1'?'سأحضر':'أعتذر']].forEach(([k,v])=>{const d=document.createElement('div');d.textContent=k+': '+v;$('sum').appendChild(d)});$('dlg').showModal()};
$('no').onclick=()=>$('dlg').close();
$('yes').onclick=async()=>{const b=$('yes');b.disabled=true;try{
 const att=document.querySelector('[name=a]:checked').value==='1';
 const r=await call('submitRegistration')({sid:sel.sid,parentName:$('pn').value.trim(),phone:phone(),attending:att,website:$('hp').value});
 $('dlg').close();$('form').hidden=true;$('done').hidden=false;
 $('done').textContent=(r.data.updated?'تم تحديث ردكم. ':'')+(att?'شكرًا لكم، تم تسجيل تأكيد حضوركم. ننتظركم بكل ترحيب.':'شكرًا لإبلاغنا، نقدّر ردكم ونتمنى لقاءكم في فرصة قادمة.');
 }catch(x){$('dlg').close();$('e2').textContent=msg(x)}finally{b.disabled=false}};
</script></body></html>
