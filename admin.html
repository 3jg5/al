    var csv="﻿الاسم,الحالة,العدد,الوقت\r\n"+rows.map(function(r){return [r.name,r.status==="attending"?"سيحضر":"معتذر",r.status==="attending"?(r.guests||1):0,r.created_at].map(cs).join(",")}).join("\r\n");

$("#dl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out()],{type:"text/javascript"}));a.download="config.js";a.click();msg("تم تحميل config.js. ارفعوه على GitHub مكان الملف القديم.",1)};

var S={};try{S=JSON.parse(localStorage.getItem("gh")||"{}")}catch(e){}

  var url="https://api.github.com/repos/"+S.o+"/"+S.r+"/contents/config.js",h={Authorization:"Bearer "+S.t,Accept:"application/vnd.github+json"};

  .then(function(j){return fetch(url,{method:"PUT",headers:h,body:JSON.stringify({message:"تحديث إعدادات الدعوة",content:b64(out()),sha:j.sha})})})

  .catch(function(e){msg(e.message||"حدث خطأ",0)}).then(function(){$("#pub").disabled=false});
};
